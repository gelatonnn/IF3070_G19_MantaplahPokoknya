name: Validasi dataset dan Hill-Climbing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Referensi: https://github.com/actions/checkout
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Referensi: https://github.com/actions/setup-python
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validasi sintaks JSON dataset utama
        run: python -m json.tool data/data.json > /dev/null
      - name: Uji foundation dengan dataset utama
        run: python -m src.Core.check_foundation data/data.json
      - name: Uji foundation dan algoritma
        run: python -m unittest discover -s tests -v
      - name: Smoke test eksperimen tanpa grafik
        run: python -m src.main --data data/data.json --algorithm steepest --seeds 42 --max-iterations 1 --no-plots --output output/ci-smoke
